<!doctype html>
<!-- Six single-character boxes, which is how most modern code entry looks. -->
<meta charset="utf-8">
<title>Confirm it is you</title>
<h1>Enter the 6-digit code we emailed you</h1>
<form id="form" onsubmit="event.preventDefault(); window.__submitted = true;">
  <div class="boxes">
    <span><input maxlength="1" type="text" inputmode="numeric" aria-label="Digit 1"></span>
    <span><input maxlength="1" type="text" inputmode="numeric" aria-label="Digit 2"></span>
    <span><input maxlength="1" type="text" inputmode="numeric" aria-label="Digit 3"></span>
    <span><input maxlength="1" type="text" inputmode="numeric" aria-label="Digit 4"></span>
    <span><input maxlength="1" type="text" inputmode="numeric" aria-label="Digit 5"></span>
    <span><input maxlength="1" type="text" inputmode="numeric" aria-label="Digit 6"></span>
  </div>
  <button type="submit">Continue</button>
</form>
<script src="/content.js"></script>
