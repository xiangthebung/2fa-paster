<!doctype html>
<!--
  A payment form. "Security code" is the CVV label on most checkout pages, so
  every hint this page offers points at a field that must never be filled.
-->
<meta charset="utf-8">
<title>Checkout</title>
<h1>Payment details</h1>
<p>Enter the code from the back of your card to confirm this order.</p>
<form id="form" onsubmit="event.preventDefault(); window.__submitted = true;">
  <label for="cardnumber">Card number</label>
  <input id="cardnumber" name="cardnumber" type="text" autocomplete="cc-number" maxlength="19">
  <label for="cvv">Security code</label>
  <input id="cvv" name="cvv" type="text" autocomplete="cc-csc" maxlength="3" inputmode="numeric">
  <label for="exp">Expiry</label>
  <input id="exp" name="cc-exp" type="text" maxlength="5">
  <label for="postcode">Post code</label>
  <input id="postcode" name="billing-postcode" type="text" maxlength="8">
  <button type="submit">Pay now</button>
</form>
<script src="/content.js"></script>
