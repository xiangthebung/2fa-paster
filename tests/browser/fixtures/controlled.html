<!doctype html>
<!--
  A framework-controlled input, of the kind React produces: the element carries
  its own `value` setter, and a plain assignment through it is discarded. Only a
  write through the prototype's setter reaches the element.
-->
<meta charset="utf-8">
<title>Verify</title>
<h1>Enter your verification code</h1>
<form id="form" onsubmit="event.preventDefault(); window.__submitted = true;">
  <label for="code">Verification code</label>
  <input id="code" name="otp" type="text" autocomplete="one-time-code" maxlength="6">
  <button type="submit">Continue</button>
</form>
<script>
  (() => {
    const input = document.getElementById('code');
    const native = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
    window.__inputEvents = 0;
    input.addEventListener('input', () => { window.__inputEvents += 1; });
    Object.defineProperty(input, 'value', {
      configurable: true,
      get() { return native.get.call(this); },
      // Swallowed, exactly as a controlled component discards a write it did not
      // originate. Reaching past this to the prototype setter is the whole point.
      set() {},
    });
  })();
</script>
<script src="/content.js"></script>
