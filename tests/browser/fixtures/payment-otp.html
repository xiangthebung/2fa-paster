<!doctype html>
<!--
  A card confirmation: the card fields and the one-time code box on the same
  form, which is how a 3-D Secure step looks. The code has to land in the right
  box, and the reply has to name the box that was passed over and why — "Security
  code" here is the CVV, and the popup says so.
-->
<meta charset="utf-8">
<title>Confirm your payment</title>
<h1>Confirm your payment</h1>
<p>We sent a verification code to your email. Enter it below to approve this payment.</p>
<form id="form" onsubmit="event.preventDefault(); window.__submitted = true;">
  <label for="cardnumber">Card number</label>
  <input id="cardnumber" name="cardnumber" type="text" autocomplete="cc-number" maxlength="19">
  <label for="cvv">Security code</label>
  <input id="cvv" name="cvv" type="text" autocomplete="cc-csc" maxlength="3" inputmode="numeric">
  <label for="code">Verification code</label>
  <input id="code" name="otp" type="text" maxlength="6" inputmode="numeric">
  <button type="submit" onclick="(window.__clicked = window.__clicked || []).push('Verify')">Verify</button>
</form>
<script src="/content.js"></script>
