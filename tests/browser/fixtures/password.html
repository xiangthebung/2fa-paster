<!doctype html>
<!-- A password prompt that talks about signing in. Nothing here is a code box. -->
<meta charset="utf-8">
<title>Sign in</title>
<h1>Sign in to your account</h1>
<p>Use your password to authenticate. Two-step verification comes next.</p>
<form id="form" onsubmit="event.preventDefault(); window.__submitted = true;">
  <label for="user">Email</label>
  <input id="user" name="username" type="text" autocomplete="username">
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password">
  <button type="submit">Log in</button>
</form>
<script src="/content.js"></script>
